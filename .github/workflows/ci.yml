name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  cpu-mpi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MPI
        run: sudo apt-get update -qq && sudo apt-get install -y -qq openmpi-bin libopenmpi-dev
      - name: Build
        run: cmake -S . -B build -DLOB_USE_MPI=ON && cmake --build build -j
      - name: Unit tests
        run: ./build/lob_tests
      - name: Determinism across serial, OpenMP and MPI
        run: bash scripts/check_determinism.sh build --agents 20000 --ticks 200
